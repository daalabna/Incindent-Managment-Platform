name: sentinel-ha
x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    rabbit1: {condition: service_healthy}
    rabbit2: {condition: service_healthy}
    rabbit3: {condition: service_healthy}
x-alpha: &alpha
  SENTINEL_MODE: distributed
  AUTH_REQUIRED: 'true'
  COOKIE_SECURE: 'true'
  TRUSTED_PROXIES: uniquelocal
  TENANT_ID: alpha
  DATABASE_URL: postgresql://tenant_a:${HA_TENANT_A_PASSWORD:?Run npm run ha:prepare}@postgres:5432/sentinel
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://sentinel:${HA_RABBIT_PASSWORD:?Run npm run ha:prepare}@rabbit1:5672
  RABBITMQ_URLS: amqp://sentinel:${HA_RABBIT_PASSWORD}@rabbit1:5672,amqp://sentinel:${HA_RABBIT_PASSWORD}@rabbit2:5672,amqp://sentinel:${HA_RABBIT_PASSWORD}@rabbit3:5672
  INFRA_NAMESPACE: sentinel_ha
  EMBEDDED_WORKER: 'false'
  ALLOWED_HOSTS: alpha.localhost:8443
  NOTIFICATION_DELIVERY: dry-run
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_MODEL: ${AI_MODEL:-gpt-4.1-mini-2025-04-14}
  AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-50}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
x-rabbit: &rabbit
  image: rabbitmq:4-management-alpine
  restart: unless-stopped
  environment:
    RABBITMQ_ERLANG_COOKIE: ${HA_ERLANG_COOKIE:?Run npm run ha:prepare}
    RABBITMQ_DEFAULT_USER: sentinel
    RABBITMQ_DEFAULT_PASS: ${HA_RABBIT_PASSWORD}
  healthcheck:
    test: ['CMD','rabbitmq-diagnostics','-q','ping']
    interval: 5s
    timeout: 5s
    retries: 30
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${HA_POSTGRES_PASSWORD:?Run npm run ha:prepare}
      POSTGRES_DB: sentinel
      TENANT_A_DB_PASSWORD: ${HA_TENANT_A_PASSWORD}
      TENANT_B_DB_PASSWORD: ${HA_TENANT_B_PASSWORD}
    volumes: ['ha-pg:/var/lib/postgresql/data','./infra/postgres-init.sh:/docker-entrypoint-initdb.d/10-tenants.sh:ro']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U sentinel -d sentinel']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ['redis-server','--appendonly','yes']
    volumes: ['ha-redis:/data']
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 3s
      timeout: 3s
      retries: 30
  rabbit1:
    <<: *rabbit
    hostname: rabbit1
    volumes: ['ha-rabbit1:/var/lib/rabbitmq','./infra/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro']
    ports: ['127.0.0.1:15682:15672']
  rabbit2:
    <<: *rabbit
    hostname: rabbit2
    volumes: ['ha-rabbit2:/var/lib/rabbitmq','./infra/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro']
  rabbit3:
    <<: *rabbit
    hostname: rabbit3
    volumes: ['ha-rabbit3:/var/lib/rabbitmq','./infra/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro']
  api-a:
    <<: *app
    environment: *alpha
  api-a2:
    <<: *app
    environment: *alpha
  api-b:
    <<: *app
    environment:
      <<: *alpha
      TENANT_ID: beta
      DATABASE_URL: postgresql://tenant_b:${HA_TENANT_B_PASSWORD}@postgres:5432/sentinel
      ALLOWED_HOSTS: beta.localhost:8443
  worker-a:
    <<: *app
    command: ['npm','run','worker']
    environment:
      <<: *alpha
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  worker-b:
    <<: *app
    command: ['npm','run','worker']
    environment:
      <<: *alpha
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TENANT_ID: beta
      DATABASE_URL: postgresql://tenant_b:${HA_TENANT_B_PASSWORD}@postgres:5432/sentinel
  tls:
    image: nginx:alpine
    ports: ['127.0.0.1:8443:443']
    volumes: ['./infra/nginx.conf:/etc/nginx/nginx.conf:ro','./.secrets/tls:/certs:ro']
    depends_on: [api-a,api-a2,api-b]
  otel:
    image: otel/opentelemetry-collector:0.120.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro']
volumes:
  ha-pg:
  ha-redis:
  ha-rabbit1:
  ha-rabbit2:
  ha-rabbit3:
