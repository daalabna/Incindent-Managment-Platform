services:
  sentinel:
    build: .
    ports: ["127.0.0.1:4000:4000"]
    environment:
      SENTINEL_MODE: distributed
      DATABASE_URL: postgresql://sentinel:local-development-only@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://sentinel:local-development-only@rabbitmq:5672
      EMBEDDED_WORKER: "false"
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini-2025-04-14}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-50}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["npm", "run", "worker"]
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini-2025-04-14}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-50}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTINEL_MODE: distributed
      DATABASE_URL: postgresql://sentinel:local-development-only@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://sentinel:local-development-only@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: sentinel
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sentinel
      RABBITMQ_DEFAULT_PASS: local-development-only
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
